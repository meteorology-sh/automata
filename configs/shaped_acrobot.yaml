# RL Harness — Shaped Acrobot Configuration
# Uses a custom BaseEnv subclass with dense reward shaping.
# Demonstrates the subclassing path: reward logic lives in the env, not the training loop.
env:
  name: "Acrobot-v1"
  wrapper: "envs.shaped_acrobot.ShapedAcrobot"
  image_size: 224
  max_episode_steps: 500
model:
  type: "mlp"
  hidden_size: 128
  num_actions: 3
  state_size: 6
training:
  episodes: 1500
  batch_size: 64
  lr: 0.0005
  gamma: 0.99
  memory_size: 50000
  solve_threshold: -100
epsilon:
  start: 1.0
  min: 0.01
  decay: 0.997
checkpoints:
  dir: "checkpoints/"
  save_every: 100
  keep_best: true
visualizer:
  enabled: true
  action_labels: ["Torque -1", "None", "Torque +1"]
