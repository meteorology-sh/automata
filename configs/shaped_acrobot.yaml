# RL Harness — Shaped Acrobot Configuration
# Uses a custom BaseEnv subclass with dense reward shaping.
# Demonstrates the subclassing path: reward logic lives in the env, not the training loop.
env:
  name: "Acrobot-v1"
  wrapper: "envs.shaped_acrobot.ShapedAcrobot"
  image_size: 224
  max_episode_steps: 500
model:
  type: "mlp"
  hidden_size: 128
  num_actions: 3
  state_size: 6
training:
  episodes: 1000
  batch_size: 128
  lr: 0.0001
  gamma: 0.99
  memory_size: 10000
  train_every: 1
  tau: 0.005
  solve_window: 50
  solve_threshold: -100
epsilon:
  start: 0.9
  min: 0.01
  decay: 0.995
checkpoints:
  dir: "checkpoints/"
  save_every: 100
  keep_best: true
visualizer:
  enabled: true
