# RL Harness — Default Configuration (LunarLander-v3)
# Land a spacecraft between the flags using discrete thrust controls.
# State: [x, y, vx, vy, angle, angular_vel, left_leg_contact, right_leg_contact]
# Actions: 0=nothing, 1=fire left, 2=fire main, 3=fire right
# Solved at average reward >= 200 over 50 episodes.
env:
  name: "LunarLander-v3"
  image_size: 224          # only used for CNN model
  max_episode_steps: 1000  # gymnasium default for LunarLander
model:
  type: "mlp"
  hidden_size: 128
  num_actions: 4
  state_size: 8
training:
  episodes: 1000
  batch_size: 128
  lr: 0.0001
  gamma: 0.99
  memory_size: 10000
  train_every: 1
  tau: 0.005
  double_dqn: true         # online net picks the next action, target net scores it
  n_step: 1                # 1 = plain 1-step DQN; raise when the payoff is far from the act
  explore_hold: 1          # 1 = per-step epsilon; raise for coherent exploratory manoeuvres
  solve_window: 50
  solve_threshold: 200
epsilon:
  start: 0.9
  min: 0.01
  decay: 0.995
checkpoints:
  dir: "checkpoints/"
  save_every: 100
  keep_best: true
  best_metric: "reward"    # "reward" | "success" (needs info["is_success"]) | any numeric info key
visualizer:
  enabled: true
